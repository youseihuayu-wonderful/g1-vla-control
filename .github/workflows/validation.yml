name: G1 EDU sim-to-real validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  headless-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install headless OpenGL
        run: sudo apt-get update && sudo apt-get install -y libosmesa6 libgl1-mesa-glx

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit and scene tests
        run: python -m unittest discover -s tests -v

      - name: G1 EDU production-contract dynamics
        run: |
          python run_simulation.py --baseline --output results/baseline.json
          python run_simulation.py --output results/adaptive.json
          python g1_adaptive_phase_validation.py --output results/g1_adaptive_phase_validation.json

      - name: Three-camera render smoke test
        run: python render_camera_observations.py

      - name: Verify frozen G1 contract and report
        run: |
          python - <<'PY'
          import json
          for path in (
              'results/baseline.json', 'results/adaptive.json',
              'results/g1_adaptive_phase_validation.json',
          ):
              result = json.load(open(path))
              assert result['g1_policy_contract_id'] == 'g1_edu_dual_dex1_eef_v1'
              assert result['g1_contract_verified'] is True
              assert result['g1_hardware_execution_enabled'] is False
              assert result['success'] is True
          phase = json.load(open('results/g1_adaptive_phase_validation.json'))
          assert phase['coverage']['fast_when_far'] is True
          assert phase['coverage']['slow_when_near'] is True
          assert phase['comparison']['real_lgg100_behavior_proven'] is False
          PY
          python generate_report.py
          grep -q 'g1_edu_dual_dex1_eef_v1' validation_report.html
          grep -q '结构化开发日志' validation_report.html
          grep -q '本次完成' validation_report.html
          grep -q '还差什么' validation_report.html
          grep -q 'g1_execution_enabled=false' validation_report.html
          ! grep -Eq 'CHECKROWS|TESTPASS|TESTTOTAL|PROGRESS%' validation_report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            results/*.json
            results/*.npz
            results/camera_observations/*.png
            validation_report.html
